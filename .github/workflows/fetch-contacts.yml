name: Fetch business contact emails

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch directory under batches/ containing targets.json"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('worker/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r worker/requirements.txt
          pip install tldextract
          python -m playwright install chromium --with-deps

      - name: Fetch contact emails
        run: |
          python worker/fetch_contacts.py \
            --targets "batches/${{ inputs.batch_id }}/targets.json" \
            --out "batches/${{ inputs.batch_id }}/results.json"

      - name: Upload contact results
        uses: actions/upload-artifact@v4
        with:
          name: contacts-${{ inputs.batch_id }}
          path: batches/${{ inputs.batch_id }}/results.json
          retention-days: 1
          if-no-files-found: error
