name: Overture places extract

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Overture release, e.g. 2026-09-23.1"
        required: true
        type: string
      states:
        description: "Comma-separated US state codes, e.g. AZ,ND,SD"
        required: true
        type: string
      extract_id:
        description: "Unique id for this extract (used in artifact name)"
        required: true
        type: string
      split_mb:
        description: "If set, split parquet into ~N MB chunks and commit them"
        required: false
        type: string
        default: ""

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install duckdb pyarrow

      - name: Extract places
        id: extract
        run: |
          set -o pipefail
          export SPLIT_MB="${{ inputs.split_mb }}"
          python worker/overture_extract.py \
            --release "${{ inputs.release }}" \
            --states "${{ inputs.states }}" \
            --out "overture_${{ inputs.extract_id }}.parquet" 2>&1 | tee "extract_${{ inputs.extract_id }}.log"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-log-${{ inputs.extract_id }}
          path: extract_${{ inputs.extract_id }}.log
          retention-days: 7

      - name: Commit stats JSON
        if: always()
        run: |
          git config user.name "sfn-fetch-bot"
          git config user.email "sfn-fetch-bot@users.noreply.github.com"
          mkdir -p overture-stats
          cp "overture_${{ inputs.extract_id }}.stats.json" "overture-stats/${{ inputs.extract_id }}.json" 2>/dev/null || echo "no stats (extract failed)"
          git add "overture-stats/${{ inputs.extract_id }}.json" 2>/dev/null || true
          git commit -m "overture stats ${{ inputs.extract_id }}" || echo "nothing to commit"
          # Retry push a few times (concurrent runs can collide).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || true
            if git push; then break; fi
            sleep 10
          done

      - name: Commit data chunks (for production import)
        if: steps.extract.outputs.exit_code == '0' && inputs.split_mb != ''
        run: |
          git config user.name "sfn-fetch-bot"
          git config user.email "sfn-fetch-bot@users.noreply.github.com"
          mkdir -p "overture-data/${{ inputs.extract_id }}"
          cp overture_${{ inputs.extract_id }}.chunk*.parquet "overture-data/${{ inputs.extract_id }}/" 2>/dev/null || echo "no chunks"
          git add "overture-data/${{ inputs.extract_id }}/"
          git commit -m "overture data ${{ inputs.extract_id }}" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || true
            if git push; then break; fi
            sleep 10
          done

      - name: Upload extract
        if: steps.extract.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: overture-${{ inputs.extract_id }}
          path: overture_${{ inputs.extract_id }}.parquet
          retention-days: 7
